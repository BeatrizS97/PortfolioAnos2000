# .github/workflows/supabase-keepalive.yml
# Mantém o projeto Supabase (plano gratuito) ativo: o plano gratuito pausa o projeto depois de 7 dias sem atividade.
# Este workflow chama a própria API do portfólio (/api/profile), que consulta o banco, a cada 3 dias.
name: Supabase keep-alive

on:
  schedule:
    # A cada 3 dias, às 12:00 UTC (09:00 no horário de Brasília).
    - cron: '0 12 */3 * *'
  # Permite rodar na mão (aba Actions > Run workflow) para testar.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a API do portfólio
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "A variável SITE_URL não está configurada (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # O parâmetro keepalive muda a URL a cada execução, para o cache da Vercel não responder no lugar do banco.
          # O --fail faz o workflow falhar se a API responder com erro (aí o GitHub avisa você por e-mail).
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            "$SITE_URL/api/profile?keepalive=$(date +%s)"
          echo
          echo "Ping concluído."